version: '2.4'
services:
  picar_humble_nvidia:
    image: ghcr.io/ # Use the current branch tag, else there will be errors!
    runtime: nvidia
    environment:
        ROS_DOMAIN_ID: 1
        DISPLAY: $DISPLAY
        QT_X11_NO_MITSHM: '1'
        NVIDIA_VISIBLE_DEVICES: all
        NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    network_mode: host
    stdin_open: true
    privileged: true
    volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - $HOME/.Xauthority:/root/.Xauthority
        - ../src:/root/src
        - ../test_pkgs:/root/ros2_ws/src
    command: >
      /bin/bash -c "
        cp -rn /root/src/* /root/ros2_ws/src/ 2>/dev/null || true && 
        exec bash"
