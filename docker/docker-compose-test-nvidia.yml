services:
  picar_humble_test_nvidia:
    image: ghcr.io/  # Make sure to use correct branch tag!!!
    runtime: nvidia
    environment:
        ROS_DOMAIN_ID: 1
        DISPLAY: $DISPLAY
        QT_X11_NO_MITSHM: '1'
        NVIDIA_VISIBLE_DEVICES: all
        NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    network_mode: host
    stdin_open: true
    privileged: true
    volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - $HOME/.Xauthority:/root/.Xauthority
    command: /bin/bash -c "exec bash"
