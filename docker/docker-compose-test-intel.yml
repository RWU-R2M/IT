version: '2.4'
services:
  picar_humble_test_intel:
    image: ghcr.io/  # Make sure to use correct branch tag!!!
    environment:
        ROS_DOMAIN_ID: 1
        DISPLAY: $DISPLAY
        QT_X11_NO_MITSHM: '1'
    network_mode: host
    stdin_open: true
    privileged: true
    volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - $HOME/.Xauthority:/root/.Xauthority
    command: /bin/bash -c "exec bash"
